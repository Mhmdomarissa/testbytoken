<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Data Recruitment — Homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; background: #0a1628; }
  body { font-family: 'Montserrat', sans-serif; }
  a { color: #c9a96e; }
  a:hover { color: #e0c495; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ─── SHARED TOKENS ───────────────────────────────────────────
const GOLD_HEX = '#c9a96e';
const WARM_WHITE = '#f8f4ee';
const BLUE_DEEP = '#0a1628';
const BLUE_MID  = '#0d2244';
const BLUE_LIGHT = '#1a3a6b';
const BLUE_BRIGHT = '#1e4d8c';
const MUTED = '#8a9ab5';

// Real Unsplash photos
const PHOTOS = {
  hero: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=1600&q=80&fit=crop',
  about: 'https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=900&q=80&fit=crop',
  service1: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&q=80&fit=crop',
  service2: 'https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=600&q=80&fit=crop',
  service3: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600&q=80&fit=crop',
  cta: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1600&q=80&fit=crop',
};

function Homepage() {
  return (
    <div style={{ background: BLUE_DEEP, fontFamily: 'Montserrat, sans-serif', color: WARM_WHITE, width: '100%', overflow: 'hidden' }}>
      {/* NAV */}
      <nav style={{ background: BLUE_DEEP, borderBottom: '1px solid rgba(255,255,255,0.07)', position: 'sticky', top: 0, zIndex: 100 }}>
        <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 60px', height: 76, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <a href="#" style={{ textDecoration: 'none', display: 'flex', flexDirection: 'column', lineHeight: 1.1 }}>
            <span style={{ fontWeight: 700, fontSize: 17, letterSpacing: '0.2em', color: GOLD_HEX, textTransform: 'uppercase' }}>Alpha Data</span>
            <span style={{ fontWeight: 300, fontSize: 9, letterSpacing: '0.26em', color: MUTED, textTransform: 'uppercase', marginTop: 3 }}>Recruitment</span>
          </a>
          <ul style={{ display: 'flex', gap: 40, listStyle: 'none', alignItems: 'center' }}>
            {['About Us', 'Services', 'Industries', 'Careers', 'Contact'].map(item => (
              <li key={item}><a href="#" style={{ fontSize: 11, fontWeight: 500, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(248,244,238,0.75)', textDecoration: 'none' }}>{item}</a></li>
            ))}
          </ul>
          <button style={{ background: 'transparent', color: GOLD_HEX, border: `1.5px solid ${GOLD_HEX}`, padding: '11px 26px', fontSize: 11, fontWeight: 600, letterSpacing: '0.15em', textTransform: 'uppercase', cursor: 'pointer', fontFamily: 'Montserrat, sans-serif' }}>Get in Touch</button>
        </div>
      </nav>

      {/* HERO */}
      <section style={{ position: 'relative', height: 700, overflow: 'hidden' }}>
        <img src={PHOTOS.hero} alt="Dubai skyline" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(100deg, rgba(10,22,40,0.96) 38%, rgba(10,22,40,0.55) 70%, rgba(10,22,40,0.15) 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, zIndex: 2, maxWidth: 1280, margin: '0 auto', padding: '0 60px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 32 }}>
            <div style={{ width: 48, height: 1.5, background: GOLD_HEX }} />
            <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.26em', textTransform: 'uppercase', color: GOLD_HEX }}>UAE's Premier Staffing Partner</span>
          </div>
          <h1 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 82, fontWeight: 300, lineHeight: 1.05, color: WARM_WHITE, marginBottom: 36, maxWidth: 780, letterSpacing: '-0.02em' }}>
            The people who<br />
            <em style={{ fontStyle: 'italic', color: GOLD_HEX }}>drive your business</em><br />
            forward.
          </h1>
          <p style={{ fontSize: 16, lineHeight: 1.85, color: 'rgba(248,244,238,0.72)', maxWidth: 540, marginBottom: 52, fontWeight: 300 }}>
            We hire every outsourced professional as if they are an internal hire — and treat them as such. That's the Alpha Data difference.
          </p>
          <div style={{ display: 'flex', gap: 18 }}>
            <button style={{ background: GOLD_HEX, color: BLUE_DEEP, border: 'none', padding: '16px 44px', fontSize: 12, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase', cursor: 'pointer', fontFamily: 'Montserrat, sans-serif' }}>Find Talent</button>
            <button style={{ background: 'transparent', color: WARM_WHITE, border: '1.5px solid rgba(248,244,238,0.35)', padding: '15px 40px', fontSize: 12, fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', cursor: 'pointer', fontFamily: 'Montserrat, sans-serif' }}>Browse Roles</button>
          </div>
        </div>
      </section>

      {/* STATS BAR */}
      <section style={{ background: BLUE_BRIGHT, padding: '44px 60px', display: 'flex', justifyContent: 'center' }}>
        {[
          { number: '700+', label: 'Active Placements' },
          { number: '20+', label: 'Years in the UAE' },
          { number: '50+', label: 'Industry Sectors' },
          { number: '2', label: 'Offices Nationwide' },
        ].map((s, i) => (
          <React.Fragment key={s.label}>
            <div style={{ textAlign: 'center', padding: '0 48px' }}>
              <div style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 58, fontWeight: 300, lineHeight: 1, color: GOLD_HEX, letterSpacing: '-0.02em' }}>{s.number}</div>
              <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'rgba(248,244,238,0.55)', marginTop: 10 }}>{s.label}</div>
            </div>
            {i < 3 && <div style={{ width: 1, background: 'rgba(255,255,255,0.15)', alignSelf: 'stretch', margin: '0 8px' }} />}
          </React.Fragment>
        ))}
      </section>

      {/* ABOUT */}
      <section style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', minHeight: 580 }}>
        <div style={{ position: 'relative', overflow: 'hidden' }}>
          <img src={PHOTOS.about} alt="Team" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
          <div style={{ position: 'absolute', bottom: 40, right: -1, background: BLUE_BRIGHT, padding: '28px 36px', borderLeft: `4px solid ${GOLD_HEX}` }}>
            <div style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 44, fontWeight: 300, color: GOLD_HEX, lineHeight: 1 }}>700+</div>
            <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(248,244,238,0.6)', marginTop: 8 }}>Professionals Placed</div>
          </div>
        </div>
        <div style={{ background: BLUE_MID, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '80px 72px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 28 }}>
            <div style={{ width: 36, height: 1.5, background: GOLD_HEX }} />
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.24em', textTransform: 'uppercase', color: GOLD_HEX }}>Our Philosophy</span>
          </div>
          <h2 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 50, fontWeight: 300, lineHeight: 1.18, color: WARM_WHITE, marginBottom: 32 }}>
            Humanity at the<br />
            <em style={{ fontStyle: 'italic', color: GOLD_HEX }}>heart of every hire.</em>
          </h2>
          <p style={{ fontSize: 15, lineHeight: 1.9, color: 'rgba(248,244,238,0.6)', marginBottom: 20 }}>
            At Alpha Data Recruitment, we don't just fill positions — we build careers. Every professional we place is vetted, supported, and treated like part of our own team.
          </p>
          <p style={{ fontSize: 15, lineHeight: 1.9, color: 'rgba(248,244,238,0.6)', marginBottom: 44 }}>
            As an Emirati establishment and sister company of Alpha Data, we carry 20+ years of UAE market expertise and an active network of 700+ professionals.
          </p>
          <a href="#" style={{ display: 'inline-flex', alignItems: 'center', gap: 12, fontSize: 11, fontWeight: 700, letterSpacing: '0.2em', textTransform: 'uppercase', color: GOLD_HEX, textDecoration: 'none' }}>
            <span>Discover our story</span><span style={{ fontSize: 16 }}>→</span>
          </a>
        </div>
      </section>

      {/* SERVICES */}
      <section style={{ background: BLUE_DEEP, padding: '90px 60px' }}>
        <div style={{ maxWidth: 1280, margin: '0 auto' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 64 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 22 }}>
                <div style={{ width: 36, height: 1.5, background: GOLD_HEX }} />
                <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.24em', textTransform: 'uppercase', color: GOLD_HEX }}>What We Do</span>
              </div>
              <h2 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 52, fontWeight: 300, color: WARM_WHITE, lineHeight: 1.15 }}>Our Services</h2>
            </div>
            <a href="#" style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase', color: GOLD_HEX, textDecoration: 'none', borderBottom: `1.5px solid ${GOLD_HEX}`, paddingBottom: 3 }}>View all services →</a>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 2 }}>
            {[
              { title: 'Staff Outsourcing', body: 'End-to-end outsourcing of skilled professionals across IT, healthcare, banking and beyond. 700+ individuals placed across the UAE.', photo: PHOTOS.service1, num: '01' },
              { title: 'Contract Staffing', body: 'Flexible, short-to-long term contract placements for project-based or seasonal workforce needs — deployed fast, managed with care.', photo: PHOTOS.service2, num: '02' },
              { title: 'Executive Search', body: "Permanent hire solutions with deep 360\u00b0 cultural assessments to match candidates to your organisation\u2019s identity, not just the job spec.", photo: PHOTOS.service3, num: '03' },
            ].map(s => (
              <div key={s.title} style={{ background: BLUE_MID, overflow: 'hidden', cursor: 'pointer' }}
                onMouseEnter={e => { e.currentTarget.style.background = BLUE_LIGHT; }}
                onMouseLeave={e => { e.currentTarget.style.background = BLUE_MID; }}
              >
                <div style={{ height: 200, overflow: 'hidden', position: 'relative' }}>
                  <img src={s.photo} alt={s.title} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                  <div style={{ position: 'absolute', inset: 0, background: 'rgba(10,22,40,0.35)' }} />
                  <div style={{ position: 'absolute', top: 20, left: 20, fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 15, color: GOLD_HEX, letterSpacing: '0.04em' }}>{s.num}</div>
                </div>
                <div style={{ padding: '32px 32px 40px' }}>
                  <div style={{ width: 32, height: 1.5, background: GOLD_HEX, marginBottom: 20 }} />
                  <h3 style={{ fontSize: 20, fontWeight: 600, color: WARM_WHITE, marginBottom: 16, lineHeight: 1.3 }}>{s.title}</h3>
                  <p style={{ fontSize: 14, lineHeight: 1.8, color: 'rgba(248,244,238,0.55)' }}>{s.body}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* INDUSTRIES */}
      <section style={{ background: BLUE_MID, padding: '90px 60px', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
        <div style={{ maxWidth: 1280, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 22, justifyContent: 'center' }}>
            <div style={{ width: 36, height: 1.5, background: GOLD_HEX }} />
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.24em', textTransform: 'uppercase', color: GOLD_HEX }}>Sectors We Serve</span>
            <div style={{ width: 36, height: 1.5, background: GOLD_HEX }} />
          </div>
          <h2 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 52, fontWeight: 300, color: WARM_WHITE, textAlign: 'center', marginBottom: 64 }}>Industries</h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 2 }}>
            {[
              { name: 'Information Technology', desc: 'Software, infrastructure & digital transformation' },
              { name: 'Healthcare & Life Sciences', desc: 'Clinical, administrative & research roles' },
              { name: 'Banking & Finance', desc: 'Retail, corporate & investment banking' },
              { name: 'Defence & Military', desc: 'Specialist technical & logistics support' },
              { name: 'Engineering', desc: 'Civil, mechanical & project engineering' },
              { name: 'Government & Public Sector', desc: 'UAE federal and emirate-level placements' },
              { name: 'Energy & Utilities', desc: 'Oil, gas, renewables & infrastructure' },
              { name: 'Retail & FMCG', desc: 'Operations, sales & supply chain' },
            ].map(ind => (
              <div key={ind.name} style={{ padding: '32px 28px', background: BLUE_DEEP, cursor: 'pointer', borderBottom: `2px solid transparent`, transition: 'all 0.2s' }}
                onMouseEnter={e => { e.currentTarget.style.background = BLUE_LIGHT; e.currentTarget.style.borderBottomColor = GOLD_HEX; }}
                onMouseLeave={e => { e.currentTarget.style.background = BLUE_DEEP; e.currentTarget.style.borderBottomColor = 'transparent'; }}
              >
                <div style={{ width: 28, height: 1.5, background: GOLD_HEX, marginBottom: 18 }} />
                <div style={{ fontSize: 15, fontWeight: 600, color: WARM_WHITE, lineHeight: 1.3, marginBottom: 10 }}>{ind.name}</div>
                <div style={{ fontSize: 12, color: MUTED, lineHeight: 1.6 }}>{ind.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{ position: 'relative', overflow: 'hidden' }}>
        <img src={PHOTOS.cta} alt="Office" style={{ width: '100%', height: 360, objectFit: 'cover', display: 'block' }} />
        <div style={{ position: 'absolute', inset: 0, background: `linear-gradient(90deg, rgba(10,22,40,0.97) 50%, rgba(10,22,40,0.6) 100%)`, display: 'flex', alignItems: 'center' }}>
          <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 60px', width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <h2 style={{ fontFamily: 'Cormorant Garamond, serif', fontSize: 54, fontWeight: 300, color: WARM_WHITE, lineHeight: 1.15, marginBottom: 16 }}>Ready to find the right people?</h2>
              <p style={{ fontSize: 15, color: 'rgba(248,244,238,0.6)', lineHeight: 1.7 }}>Talk to our expert team in Abu Dhabi or Dubai today.</p>
            </div>
            <button style={{ background: GOLD_HEX, color: BLUE_DEEP, border: 'none', padding: '18px 52px', fontSize: 12, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase', cursor: 'pointer', fontFamily: 'Montserrat, sans-serif', flexShrink: 0 }}>Get in Touch</button>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer style={{ background: '#060e1b', padding: '72px 60px 44px' }}>
        <div style={{ maxWidth: 1280, margin: '0 auto', display: 'grid', gridTemplateColumns: '2.2fr 1fr 1fr 1fr', gap: 56, marginBottom: 56 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 16, letterSpacing: '0.2em', color: GOLD_HEX, textTransform: 'uppercase', marginBottom: 4 }}>Alpha Data</div>
            <div style={{ fontWeight: 300, fontSize: 9, letterSpacing: '0.26em', color: MUTED, textTransform: 'uppercase', marginBottom: 24 }}>Recruitment</div>
            <p style={{ fontSize: 13, lineHeight: 1.85, color: 'rgba(248,244,238,0.35)', maxWidth: 260 }}>An Emirati establishment bringing humanity back to hiring since 2004.</p>
            <div style={{ display: 'flex', gap: 16, marginTop: 32 }}>
              {['in', 'tw', 'fb'].map(s => (
                <div key={s} style={{ width: 36, height: 36, border: '1px solid rgba(255,255,255,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: MUTED, cursor: 'pointer', textTransform: 'uppercase', fontWeight: 600, letterSpacing: '0.05em' }}>{s}</div>
              ))}
            </div>
          </div>
          {[
            { heading: 'Company', links: ['About Us', 'Our Mission', 'The Team', 'Contact'] },
            { heading: 'Services', links: ['Staff Outsourcing', 'Contract Staffing', 'Executive Search', 'Emirati Recruitment'] },
            { heading: 'Offices', links: ['Abu Dhabi HQ', 'Dubai — JLT', 'recruitment@alpha.ae', '+971 2 633 3644'] },
          ].map(col => (
            <div key={col.heading}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.22em', textTransform: 'uppercase', color: GOLD_HEX, marginBottom: 24 }}>{col.heading}</div>
              <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 13 }}>
                {col.links.map(l => (
                  <li key={l}><a href="#" style={{ fontSize: 13, color: 'rgba(248,244,238,0.38)', textDecoration: 'none', fontWeight: 300 }}>{l}</a></li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: 28, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontSize: 12, color: 'rgba(248,244,238,0.22)' }}>© 2025 Alpha Data Recruitment. All rights reserved.</div>
          <div style={{ display: 'flex', gap: 28 }}>
            {['Privacy Policy', 'Terms', 'Careers Portal'].map(l => (
              <a key={l} href="#" style={{ fontSize: 12, color: 'rgba(248,244,238,0.22)', textDecoration: 'none' }}>{l}</a>
            ))}
          </div>
        </div>
      </footer>
    </div>
  );
}

// ─── TWEAKS ───────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ctaLabel": "Get in Touch"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <Homepage />
      <TweaksPanel>
        <TweakSection title="Content">
          <TweakText label="CTA Button Label" value={tweaks.ctaLabel} onChange={v => setTweak('ctaLabel', v)} />
        </TweakSection>
        <TweakSection title="Design Notes">
          <div style={{ fontSize: 11, color: '#aaa', lineHeight: 1.7, padding: '8px 0' }}>
            Rich blue palette, full-bleed photos, large serif/sans type pairing.<br /><br />
            Colors: deep #0a1628 → mid #0d2244 → bright #1e4d8c + gold #c9a96e.<br />
            Fonts: Montserrat + Cormorant Garamond.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
